name: Testes Mobile (WebDriverIO)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  mobile-tests:
    name: Mobile (WebDriverIO + Appium)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm ci || npm install

      - name: Baixar APK (opcional)
        env:
          APK_URL: ${{ secrets.APK_URL }}
        run: |
          if [ -n "$APK_URL" ]; then
            mkdir -p android
            curl -L -o android/app.apk "$APK_URL"
          fi

      - name: Verificar APK
        run: |
          if [ ! -f android/app.apk ]; then
            echo "::error::APK não encontrado em android/app.apk. Adicione o arquivo ao repositório ou configure o secret APK_URL para download."
            exit 1
          fi
          echo "APK encontrado: $(ls -la android/app.apk)"

      - name: Rodar emulador e testes mobile
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_7_pro
          script: npm run test:mobile
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
        env:
          ANDROID_PLATFORM_VERSION: "14"

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-mobile
          path: allure-results/
          retention-days: 14
          if-no-files-found: warn
